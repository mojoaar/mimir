name: mimir-dev

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mimir_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owner_dev_password}
      POSTGRES_DB: mimir
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mimir_owner -d mimir']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata_dev:
    name: mimir_pgdata_dev

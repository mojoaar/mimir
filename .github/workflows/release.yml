name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One native runner per architecture. The same build under qemu took an hour
  # cold and hit the backstop twice, so emulation is gone rather than given
  # more time.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Pushed by digest only: the tagged index is assembled after both
          # legs succeed, so a half-built release never becomes :latest.
          outputs: type=image,name=ghcr.io/mojoaar/mimir,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/mojoaar/mimir:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/mojoaar/mimir:buildcache-${{ matrix.arch }},mode=max

      - name: Keep the digest for the merge
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    runs-on: ubuntu-26.04
    needs: image
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      # A tag is a claim about what the code says it is. Refuse to publish one
      # that disagrees with package.json, or with the image the compose file pins.
      - name: Refuse a tag that does not match the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          node -e "const v=require('./package.json').version; if(v!=='$tag'){console.error('package.json',v,'tag $tag');process.exit(1)}"
          node -e "const w=require('./packages/opencode-plugin/package.json').version,o=require('./packages/omp-plugin/package.json').version; if(w!=='$tag'||o!=='$tag'){console.error('plugin versions',w,o,'tag $tag');process.exit(1)}"
          grep -q "ghcr.io/mojoaar/mimir:$tag" docker-compose.yml

      - name: Tag the index
        run: |
          version="${GITHUB_REF_NAME#v}"
          images=$(for d in /tmp/digests/*; do echo "ghcr.io/mojoaar/mimir@sha256:$(basename "$d")"; done)
          docker buildx imagetools create -t "ghcr.io/mojoaar/mimir:$version" $images

      # A prerelease or a hotfix of an old line must not take :latest backwards.
      - name: Move latest
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t ghcr.io/mojoaar/mimir:latest "ghcr.io/mojoaar/mimir:$version"

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: release-notes.md

  package:
    runs-on: ubuntu-26.04
    needs: merge
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx tsc -p packages/opencode-plugin/tsconfig.json
      - run: npx tsc -p packages/omp-plugin/tsconfig.json
      - name: Publish @mojoaar/opencode-mimir
        # Skipped silently until the repository has an NPM_TOKEN secret.
        # Run inside the package: from the repo root npm reads the path as a
        # GitHub spec and tries to clone it over ssh.
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        working-directory: packages/opencode-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          # A failed second publish used to make a re-run impossible.
          npm view "@mojoaar/opencode-mimir@$version" version >/dev/null 2>&1 || npm publish --access public
      - name: Publish @mojoaar/omp-mimir
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        working-directory: packages/omp-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          npm view "@mojoaar/omp-mimir@$version" version >/dev/null 2>&1 || npm publish --access public

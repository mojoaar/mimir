name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: mimir_owner
          POSTGRES_PASSWORD: owner_dev_password
          POSTGRES_DB: mimir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimir_owner -d mimir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIMIR_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      MIMIR_TEST_DATABASE_URL: postgres://mimir_app:app_dev_password@127.0.0.1:5432/mimir_test
      MIMIR_TEST_DATABASE_ADMIN_URL: postgres://mimir_owner:owner_dev_password@127.0.0.1:5432/mimir_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Create the app role the policies expect
        run: |
          psql "postgres://mimir_owner:owner_dev_password@127.0.0.1:5432/mimir_test" -v ON_ERROR_STOP=1 \
            -c "create role mimir_app login password 'app_dev_password'" \
            -c "grant all on schema public to mimir_app"
      - run: npm run test:int
      - run: npm run build

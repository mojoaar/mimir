name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # One native runner per architecture. The same build under qemu took an hour
  # cold and hit the backstop twice, so emulation is gone rather than given
  # more time.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Pushed by digest only: the tagged index is assembled after both
          # legs succeed, so a half-built release never becomes :latest.
          outputs: type=image,name=ghcr.io/mojoaar/mimir,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/mojoaar/mimir:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/mojoaar/mimir:buildcache-${{ matrix.arch }},mode=max

      - name: Keep the digest for the merge
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    runs-on: ubuntu-26.04
    needs: image
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Tag the index
        run: |
          version="${GITHUB_REF_NAME#v}"
          images=$(for d in /tmp/digests/*; do echo "ghcr.io/mojoaar/mimir@sha256:$(basename "$d")"; done)
          docker buildx imagetools create \
            -t "ghcr.io/mojoaar/mimir:$version" \
            -t ghcr.io/mojoaar/mimir:latest \
            $images

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md

  package:
    runs-on: ubuntu-26.04
    needs: merge
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx tsc -p packages/opencode-plugin/tsconfig.json
      - run: npx tsc -p packages/omp-plugin/tsconfig.json
      - name: Publish @mojoaar/opencode-mimir
        # Skipped silently until the repository has an NPM_TOKEN secret.
        # Run inside the package: from the repo root npm reads the path as a
        # GitHub spec and tries to clone it over ssh.
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        working-directory: packages/opencode-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
      - name: Publish @mojoaar/omp-mimir
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        working-directory: packages/omp-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

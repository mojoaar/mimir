services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: mimir_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      POSTGRES_DB: mimir
      MIMIR_APP_PASSWORD: ${MIMIR_APP_PASSWORD:?set MIMIR_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/initdb/prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mimir_owner -d mimir']
      interval: 5s
      timeout: 5s
      retries: 30

  mimir:
    image: ghcr.io/mojoaar/mimir:0.16.0
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      MIMIR_PUBLIC_URL: ${MIMIR_PUBLIC_URL:-http://localhost:3000}
      MIMIR_SECRET: ${MIMIR_SECRET:?set MIMIR_SECRET (openssl rand -hex 32)}
      MIMIR_ADMIN_EMAIL: ${MIMIR_ADMIN_EMAIL:-}
      MIMIR_ADMIN_PASSWORD: ${MIMIR_ADMIN_PASSWORD:-}
      MIMIR_TRUSTED_PROXIES: ${MIMIR_TRUSTED_PROXIES:-}
      # Both passwords must be URL-safe: they are interpolated into a URI.
      DATABASE_URL: postgres://mimir_app:${MIMIR_APP_PASSWORD}@db:5432/mimir
      DATABASE_ADMIN_URL: postgres://mimir_owner:${POSTGRES_OWNER_PASSWORD}@db:5432/mimir
    depends_on:
      db:
        condition: service_healthy

  # Local embeddings. Enable with: docker compose --profile ollama up -d
  # then point the embedding provider at http://ollama:11434 and pull a model:
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    profiles: ['ollama']
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
